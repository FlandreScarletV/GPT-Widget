<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>:root{color-scheme:light dark}body{font:13px system-ui;margin:12px}#status{display:flex;gap:2ch;flex-wrap:wrap;align-items:center}button{font:inherit;color:inherit;border:0;border-bottom:1px dotted currentColor;background:none;padding:3px 0;cursor:help}button:focus-visible{outline:2px solid Highlight;outline-offset:3px}small{display:block;margin-top:10px;opacity:.7}.high{color:light-dark(#b42318,#ff8c85)}.medium{color:light-dark(#8a5b00,#ffd166)}#detail{margin-top:8px;box-sizing:border-box;width:380px;max-width:100%;padding:9px 12px;border:1px solid light-dark(#dedee3,#45464e);border-radius:8px;background:light-dark(#f8f8fa,#292a31);color:inherit;font-size:12px;line-height:1.65;box-shadow:0 3px 10px #00000012}#detail[hidden]{display:none}.detail-line{overflow-wrap:anywhere}small{font-size:11px}</style>
<div id="status">等待状态数据</div><div id="detail" role="tooltip" hidden></div><small>移到 IP 或 IP风险上查看详情。结果为数据源判断，不是账号风控。</small>
<script>
let statusData=null,detailData=null,hideTimer;
const panel=document.getElementById('detail');
function showDetail(){clearTimeout(hideTimer);panel.replaceChildren();for(const text of tooltip(detailData).split('\n')){const line=document.createElement('div');line.className='detail-line';line.textContent=text;panel.append(line)}panel.hidden=false;resize();}
function hideDetail(){hideTimer=setTimeout(()=>{panel.hidden=true;resize()},120)}
function resize(){parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:document.documentElement.scrollHeight}},'*')}
panel.onmouseenter=()=>clearTimeout(hideTimer);panel.onmouseleave=hideDetail;
const value=v=>v===true?'是':v===false?'否':v===null||v===undefined||v===''?'未知':String(v);
function tooltip(x){if(!x)return '暂无有效详情';const asn=x.asn?'AS'+String(x.asn).replace(/^AS/i,''):'未知';const region=[x.country,x.region,x.city].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(' · ');return [
'IP：'+value(x.ip),
'地区：'+(region||'未知')+' · '+asn,
'网络：'+value(x.isp??x.organization??x.company)+' · '+value(x.networkType),
'VPN '+value(x.signals?.vpn)+' · 代理 '+value(x.signals?.proxy)+' · Tor '+value(x.signals?.tor),
'机房 '+value(x.signals?.hosting)+' · 滥用标记 '+value(x.abuser),
'来源：'+[x.regionSource,x.qualitySource].filter(Boolean).map(v=>{try{return new URL(v).hostname}catch{return '未知'}}).join(' / ')+' · '+(x.observedAt?new Date(x.observedAt).toLocaleTimeString():'未知')
].join('\n');}
function render(d,meta){if(d)statusData=d;if(meta!==undefined)detailData=meta?.inspectorDetails??null;if(!statusData)return;const row=document.getElementById('status');row.replaceChildren();for(const [label,key] of [['请求模型','requestedModel'],['思考能力','reasoningEffort'],['上游模型','upstreamModel'],['供应商','provider'],['IP','ipRegion'],['IP风险','risk']]){const hover=key==='ipRegion'||key==='risk';const el=document.createElement(hover?'button':'span');el.textContent=label+'：'+(statusData[key]||'未知');if(hover){el.type='button';el.setAttribute('aria-describedby','detail');el.onmouseenter=showDetail;el.onmouseleave=hideDetail;el.onfocus=showDetail;el.onblur=hideDetail;el.onkeydown=e=>{if(e.key==='Escape'){panel.hidden=true;resize()}};}if(key==='risk')el.className=statusData.risk==='高'?'high':statusData.risk==='中'?'medium':'';row.append(el)}}
render(window.openai?.toolOutput,window.openai?.toolResponseMetadata);
window.addEventListener('openai:set_globals',e=>{const g=e.detail?.globals??{};render(g.toolOutput,g.toolResponseMetadata)});
window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.method==='ui/notifications/tool-result')render(e.data.params?.structuredContent,e.data.params?._meta??null);if(e.data?.id===1&&e.data.result)parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*')});
parent.postMessage({jsonrpc:'2.0',id:1,method:'ui/initialize',params:{appInfo:{name:'codex-model-inspector',version:'0.3.0'},appCapabilities:{},protocolVersion:'2026-01-26'}},'*');
</script></html>
